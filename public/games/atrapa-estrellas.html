<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atrapa Estrellas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #1e1b4b, #4c1d95, #7c3aed);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  h1 {
    color: #fbbf24;
    font-size: 28px;
    margin-bottom: 10px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  #hud {
    display: flex;
    gap: 30px;
    color: white;
    font-size: 18px;
    margin-bottom: 10px;
    font-weight: bold;
  }
  #hud span { color: #fbbf24; }
  canvas {
    background: #0f0a2e;
    border: 3px solid #fbbf24;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(251, 191, 36, 0.4);
    touch-action: none;
  }
  #msg {
    color: #f9fafb;
    margin-top: 14px;
    font-size: 15px;
    opacity: 0.85;
    text-align: center;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: white;
    text-align: center;
    z-index: 10;
  }
  #overlay h2 { font-size: 36px; color: #fbbf24; margin-bottom: 10px; }
  #overlay button {
    margin-top: 20px;
    padding: 12px 28px;
    font-size: 16px;
    background: #fbbf24;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }
</style>
</head>
<body>
  <h1>⭐ Atrapa Estrellas</h1>
  <div id="hud">Puntos: <span id="score">0</span> &nbsp; Vidas: <span id="lives">3</span></div>
  <canvas id="game" width="360" height="500"></canvas>
  <p id="msg">Usa las flechas ← → o toca la pantalla para mover la canasta</p>

  <div id="overlay">
    <h2>¡Juego Terminado!</h2>
    <p id="finalScore"></p>
    <button onclick="restart()">Jugar de nuevo</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const overlay = document.getElementById('overlay');

let basket = { x: 160, y: 460, w: 60, h: 20, speed: 6 };
let items = [];
let score = 0;
let lives = 3;
let running = true;
let spawnTimer = 0;
let keys = {};

function spawnItem() {
  const isBomb = Math.random() < 0.22;
  items.push({
    x: Math.random() * (canvas.width - 20) + 10,
    y: -20,
    r: 10,
    speed: 2 + Math.random() * 2 + score * 0.02,
    bomb: isBomb
  });
}

function update() {
  if (!running) return;

  if (keys['ArrowLeft']) basket.x -= basket.speed;
  if (keys['ArrowRight']) basket.x += basket.speed;
  basket.x = Math.max(0, Math.min(canvas.width - basket.w, basket.x));

  spawnTimer++;
  if (spawnTimer > 40) { spawnItem(); spawnTimer = 0; }

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.speed;

    const caught = it.y + it.r > basket.y &&
                   it.x > basket.x && it.x < basket.x + basket.w;

    if (caught) {
      items.splice(i, 1);
      if (it.bomb) {
        lives--;
        livesEl.textContent = lives;
        if (lives <= 0) endGame();
      } else {
        score += 10;
        scoreEl.textContent = score;
      }
    } else if (it.y > canvas.height + 20) {
      items.splice(i, 1);
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // basket
  ctx.fillStyle = '#22d3ee';
  ctx.fillRect(basket.x, basket.y, basket.w, basket.h);

  // items
  items.forEach(it => {
    ctx.beginPath();
    ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2);
    ctx.fillStyle = it.bomb ? '#ef4444' : '#fbbf24';
    ctx.fill();
    if (it.bomb) {
      ctx.fillStyle = 'white';
      ctx.font = '12px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('💣', it.x, it.y + 4);
    }
  });
}

function loop() {
  update();
  draw();
  if (running) requestAnimationFrame(loop);
}

function endGame() {
  running = false;
  document.getElementById('finalScore').textContent = `Puntaje final: ${score}`;
  overlay.style.display = 'flex';
}

function restart() {
  score = 0; lives = 3; items = []; running = true;
  scoreEl.textContent = 0; livesEl.textContent = 3;
  overlay.style.display = 'none';
  loop();
}

window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// touch/mouse control
canvas.addEventListener('touchmove', e => {
  const rect = canvas.getBoundingClientRect();
  const x = e.touches[0].clientX - rect.left;
  basket.x = Math.max(0, Math.min(canvas.width - basket.w, x - basket.w/2));
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  basket.x = Math.max(0, Math.min(canvas.width - basket.w, x - basket.w/2));
});

loop();
</script>
</body>
</html>
